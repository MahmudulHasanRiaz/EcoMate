name: Build Images

# FULLY MANUAL — nothing runs on push. Dispatch this workflow by hand, tick
# what you need, and only that builds:
#   runner:  self-hosted (default — warm caches, no Hub rate-limit risk) or
#            github (ubuntu-latest, native amd64 = no emulation, but cold
#            cache on first run and shared-IP Docker Hub limits can bite)
#   all + backend/storefront/admin/pos/platform-api/platform-admin/landing/
#   caddy: which images to build.
# Deployment stays manual too (Deploy SaaS workflow pulls these images).
on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner for all jobs'
        required: false
        default: self-hosted
        type: choice
        options:
          - self-hosted
          - github
      all:
        description: 'Build ALL images?'
        required: false
        default: true
        type: boolean
      backend:
        description: 'Build backend image?'
        required: false
        default: false
        type: boolean
      storefront:
        description: 'Build storefront image?'
        required: false
        default: false
        type: boolean
      admin:
        description: 'Build admin image?'
        required: false
        default: false
        type: boolean
      pos:
        description: 'Build POS image?'
        required: false
        default: false
        type: boolean
      platform-api:
        description: 'Build platform-api image?'
        required: false
        default: false
        type: boolean
      platform-admin:
        description: 'Build platform-admin image?'
        required: false
        default: false
        type: boolean
      landing:
        description: 'Build landing image?'
        required: false
        default: false
        type: boolean
      caddy:
        description: 'Build caddy (edge) image?'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

# Overlapping manual runs would fight over the single self-hosted runner and
# could push interleaved tags — cancel the stale run.
concurrency:
  group: ci-manual
  cancel-in-progress: true

jobs:
  # Static data-safety gates. These run BEFORE the backend/platform-api
  # images are built, so a destructive migration (DROP COLUMN / DELETE FROM /
  # TRUNCATE on a post-P0 migration) can never reach the published image
  # (deployment itself is manual, so the gate only needs to protect the image).
  # Only needed when the backend or platform-api image will actually rebuild.
  guards:
    name: static guards
    if: inputs.all == true || inputs.backend == true || inputs.platform-api == true
    # fromJSON array literal: runs-on accepts an expression evaluating to labels.
    runs-on: ${{ fromJSON(inputs.runner == 'github' && '["ubuntu-24.04"]' || '["self-hosted", "macos", "arm64"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.22.1
          cache: npm

      - name: Install dependencies
        if: inputs.all == true || inputs.backend == true
        run: npm ci --ignore-scripts

      - name: Migration-safety gate (no destructive post-P0 migrations)
        if: inputs.all == true || inputs.backend == true
        working-directory: apps/backend
        # Both suites are fs-only reads (no DB): migration-safety locks the
        # additive-migration rule, deploy-safety locks seed/boot repair gates.
        run: npx jest "(migration-safety|deploy-safety)"

      - name: Platform migration-safety gate (no destructive platform migrations)
        if: inputs.all == true || inputs.platform-api == true
        # fs-only grep (no DB, no node_modules needed): migration.sql files
        # must stay additive. rollback.sql files are EXCLUDED — they undo
        # by design, so DROP/TRUNCATE there is correct, not a violation.
        run: |
          if grep -rniE 'DROP[[:space:]]+(TABLE|COLUMN)|TRUNCATE[[:space:]]+(TABLE[[:space:]]+)?|DELETE[[:space:]]+FROM' apps/platform-api/prisma/migrations/*/migration.sql; then
            echo "::error::Destructive statement in a platform migration.sql — migrations must stay additive (put the undo in rollback.sql)."
            exit 1
          fi
          echo "Platform migrations additive: OK"

      - name: Plan §8 tenancy guards (PrismaClient / raw SQL / schema)
        if: inputs.all == true || inputs.backend == true
        # fs-only node script (no DB, no node_modules needed): fails on a
        # new PrismaClient outside the tenancy layer, on $queryRawUnsafe
        # outside the tenant-scoped client, and on a Prisma model without
        # tenantId. Allowlists live in the script with reasons.
        run: node scripts/saas/ci-guards.mjs

  # RLS gates. Spins up a DISPOSABLE Postgres 16 (docker, so it works on
  # both runners), applies the tenant migrations, creates the runtime app
  # role with its grants, then runs the two SQL gates: check_rls.sql must
  # return zero rows (every tenant-scoped table has RLS + force + policy +
  # trigger) and rls_smoke_test.sql must pass (two-tenant isolation as
  # ecomate_tenant_app). The container is removed afterwards, always.
  # Port 55433 avoids the dev cluster on 55432 (self-hosted runner).
  rls-gates:
    name: RLS gates
    if: inputs.all == true || inputs.backend == true
    runs-on: ${{ fromJSON(inputs.runner == 'github' && '["ubuntu-24.04"]' || '["self-hosted", "macos", "arm64"]') }}
    timeout-minutes: 30
    env:
      CI_RLS_URL: postgresql://postgres:ci-rls-only@127.0.0.1:55433/ecomate_rls_ci
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.22.1
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Start disposable Postgres 16
        run: |
          docker rm -f ci-rls-pg 2>/dev/null || true
          # Throwaway password for a disposable container (removed below).
          docker run -d --name ci-rls-pg -e POSTGRES_PASSWORD=ci-rls-only -e POSTGRES_DB=ecomate_rls_ci -p 55433:5432 postgres:16-alpine
          # The postgres entrypoint runs a TEMPORARY server during init, then
          # shuts it down and starts the real one — pg_isready alone can pass
          # against the temp server, and the next step then hits
          # "FATAL: the database system is shutting down" (run #1). Wait for
          # the init process to finish before checking readiness.
          for i in $(seq 1 90); do
            docker logs ci-rls-pg 2>&1 | grep -q "init process complete" && break
            sleep 1
          done
          for i in $(seq 1 60); do
            docker exec ci-rls-pg pg_isready -U postgres && break
            sleep 1
          done
          docker exec ci-rls-pg pg_isready -U postgres

      - name: Create app role
        run: |
          # Retry loop: belt-and-braces against the entrypoint restart window
          # (run #1 failed here on the first connection attempt).
          cat > /tmp/create-app-role.sql <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'ecomate_tenant_app') THEN
              CREATE ROLE ecomate_tenant_app LOGIN;
            END IF;
          END $$;
          SQL
          for i in $(seq 1 30); do
            docker cp /tmp/create-app-role.sql ci-rls-pg:/tmp/create-app-role.sql
            if docker exec ci-rls-pg psql -U postgres -d ecomate_rls_ci -v ON_ERROR_STOP=1 -f /tmp/create-app-role.sql; then
              break
            fi
            echo "Create app role attempt $i failed — retrying in 2s"
            sleep 2
            if [ "$i" = "30" ]; then echo "::error::Could not connect to disposable Postgres after 30 attempts"; exit 1; fi
          done

      - name: Migrate disposable DB
        working-directory: apps/backend
        run: DATABASE_URL="${{ env.CI_RLS_URL }}" npx prisma migrate deploy

      - name: Grant app role (after migrate — tables must exist)
        run: |
          docker exec -i ci-rls-pg psql -U postgres -d ecomate_rls_ci -v ON_ERROR_STOP=1 <<'SQL'
          GRANT USAGE ON SCHEMA public TO ecomate_tenant_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO ecomate_tenant_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO ecomate_tenant_app;
          GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO ecomate_tenant_app;
          SQL

      - name: RLS coverage gate (check_rls.sql must return zero rows)
        run: |
          docker cp scripts/saas/check_rls.sql ci-rls-pg:/tmp/check_rls.sql
          rows=$(docker exec ci-rls-pg psql -U postgres -d ecomate_rls_ci -t -A -v ON_ERROR_STOP=1 -f /tmp/check_rls.sql)
          if [ -n "$rows" ]; then
            echo "::error::Tables missing RLS coverage (rls_coverage view):"
            echo "$rows"
            exit 1
          fi
          echo "RLS coverage: every tenant-scoped table has RLS + force + policy + trigger"

      - name: RLS smoke test (two-tenant isolation as ecomate_tenant_app)
        run: |
          docker cp scripts/saas/rls_smoke_test.sql ci-rls-pg:/tmp/rls_smoke_test.sql
          docker exec ci-rls-pg psql -U postgres -d ecomate_rls_ci -v ON_ERROR_STOP=1 -f /tmp/rls_smoke_test.sql

      - name: Stop disposable Postgres
        if: always()
        run: docker rm -f ci-rls-pg 2>/dev/null || true

  # Dependency + secret scans. Runs on every dispatch (repo-wide, no
  # service tick needed). Deliberately NOT in any build's `needs`: a new
  # advisory in an unrelated package must not block an image build — the
  # job is a visible red/green signal, and the coordinator tightens it
  # to a gate once the baseline is clean.
  security-scan:
    name: security scan
    runs-on: ${{ fromJSON(inputs.runner == 'github' && '["ubuntu-24.04"]' || '["self-hosted", "macos", "arm64"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # gitleaks scans git history — a shallow checkout would hide it.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.22.1
          cache: npm

      - name: npm audit (high and above)
        # Reads package-lock.json; no install needed.
        run: npm audit --audit-level=high

      - name: OSV scan (all lockfiles)
        # Pinned: google/osv-scanner-action has NO floating `v2` tag
        # (latest is v2.7.1) — @v2 fails resolution and kills the job.
        # Subdirectory path: since the v2 restructure the repo is a monorepo
        # and the ROOT action.yml has no `runs:` section — the runnable
        # action lives in osv-scanner-action/ (run #2 failed on the root).
        uses: google/osv-scanner-action/osv-scanner-action@v2.7.1
        with:
          scan-args: |-
            --recursive
            --config .osv-scanner.toml
            .

      - name: Secret scan (gitleaks CLI)
        # gitleaks-action v2 requires a paid GITLEAKS_LICENSE secret since
        # the licensing change (run #4 failed on it — no leak, the action
        # refuses to run without a license). The CLI is the same free
        # open-source engine, so run it directly. Pinned to v8.30.1
        # (latest, 2026-03-21). OS/arch detected: this job runs on either
        # ubuntu-24.04 (github runner) or macos arm64 (self-hosted).
        run: |
          set -euo pipefail
          OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64) ARCH="x64" ;;
            aarch64|arm64) ARCH="arm64" ;;
          esac
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_${OS}_${ARCH}.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --verbose --redact

  # Edge config gate. Catches Caddyfile syntax errors before they reach the
  # VPS (a bad Caddyfile takes the whole stack's public edge down).
  caddy-validate:
    name: caddy validate
    if: inputs.all == true || inputs.caddy == true
    runs-on: ${{ fromJSON(inputs.runner == 'github' && '["ubuntu-24.04"]' || '["self-hosted", "macos", "arm64"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Validate Caddyfile
        # caddy:2-alpine runs on both runners (amd64 natively on github,
        # emulated on the arm64 Mac — validate is fast either way).
        # The Caddyfile's {$VAR:default} env vars all carry production
        # defaults, so no env file is needed to validate the shape.
        run: docker run --rm -v "$PWD/portainer/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  # Unit quality gate. Each suite runs only when its service was ticked.
  # Backend jest excludes the `.integration.spec.ts` files plus
  # `tenant-runtime-isolation.spec.ts`, which need a live migrated database
  # (the isolation spec says so in its own header; run #1 failed on it) —
  # so this job never touches any database and cannot pollute dev data.
  # Isolation is still covered live by the RLS gates job
  # (rls_smoke_test.sql), and the excluded specs run in the full local
  # suite with a live DB.
  unit:
    name: unit tests
    if: ${{ inputs.all == true || inputs.backend == true || inputs.storefront == true || inputs.admin == true || inputs.pos == true || inputs.platform-api == true || inputs.platform-admin == true || inputs.landing == true }}
    runs-on: ${{ fromJSON(inputs.runner == 'github' && '["ubuntu-24.04"]' || '["self-hosted", "macos", "arm64"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.22.1
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Backend unit tests
        if: inputs.all == true || inputs.backend == true
        working-directory: apps/backend
        run: |
          npx prisma generate
          # Workspace packages ship without dist/ on a fresh checkout
          # (npm ci --ignore-scripts skips their builds); the Dockerfiles build
          # them the same way before compiling the app.
          npx tsc -p ../../packages/shared-types/tsconfig.json
          npx tsc -p ../../packages/feature-flags/tsconfig.json
          npx nest build
          npx jest --no-coverage --testPathIgnorePatterns "integration" "tenant-runtime-isolation"

      - name: Platform API unit tests
        if: inputs.all == true || inputs.platform-api == true
        working-directory: apps/platform-api
        # Mirrors the backend step. The suite is unit-only with mocked
        # Prisma (no live DB) — if a spec ever needs Postgres, add a
        # postgres:16-alpine service container to this job first.
        run: |
          npx prisma generate
          npx tsc -p ../../packages/shared-types/tsconfig.json
          npx nest build
          npx jest --no-coverage

      - name: Platform admin unit tests
        if: inputs.all == true || inputs.platform-admin == true
        working-directory: apps/platform-admin
        # Node-environment vitest, no browser needed (unlike tenant admin,
        # no Playwright step).
        run: |
          npx tsc -b
          npx vitest run

      - name: Landing unit tests
        if: inputs.all == true || inputs.landing == true
        working-directory: apps/landing
        # The build step catches next.config.ts rewrite errors the
        # typecheck cannot (mirrors the pos step's build check).
        run: |
          npx tsc --noEmit
          npm test
          npm run build

      - name: Storefront unit tests
        if: inputs.all == true || inputs.storefront == true
        working-directory: apps/storefront
        run: |
          npx tsc --noEmit
          npm test

      - name: Cache Playwright browsers
        # Fresh github runners re-download ~300MB (chromium + ffmpeg +
        # headless shell) on EVERY run; the self-hosted Mac has them
        # preinstalled. Key follows the lockfile so a Playwright bump
        # invalidates the cache automatically.
        if: inputs.all == true || inputs.admin == true
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Admin unit tests
        if: inputs.all == true || inputs.admin == true
        working-directory: apps/admin
        run: |
          # shared-types ships without dist/ on a fresh checkout (same reason
          # as backend above; the admin Dockerfile builds it explicitly too).
          npx tsc -p ../../packages/shared-types/tsconfig.json
          npx tsc --noEmit -p tsconfig.app.json
          # Vitest runs in real-chromium browser mode: browsers are preinstalled
          # on the self-hosted runner but missing on a fresh github runner.
          # Plain install (no --with-deps: that needs apt/sudo and breaks Mac).
          npx playwright install chromium
          npx vitest run

      - name: POS unit tests
        if: inputs.all == true || inputs.pos == true
        working-directory: apps/pos
        run: |
          npx tsc -b
          npx vite build

  # One caller per image. Each runs only when ticked; the backend keeps the
  # raised 360min timeout (slow ghcr.io uplink from the Mac), frontends 120.
  # All builds wait for the gates, so broken tests can no longer ship.
  build-backend:
    needs: [guards, unit, rls-gates]
    if: inputs.all == true || inputs.backend == true
    uses: ./.github/workflows/build-service-image.yml
    with:
      service: backend
      timeout-minutes: 360
      runners: ${{ inputs.runner == 'github' && '["ubuntu-latest"]' || '["self-hosted", "macos", "arm64"]' }}

  build-storefront:
    needs: [unit]
    if: inputs.all == true || inputs.storefront == true
    uses: ./.github/workflows/build-service-image.yml
    with:
      service: storefront
      runners: ${{ inputs.runner == 'github' && '["ubuntu-latest"]' || '["self-hosted", "macos", "arm64"]' }}

  build-admin:
    needs: [unit]
    if: inputs.all == true || inputs.admin == true
    uses: ./.github/workflows/build-service-image.yml
    with:
      service: admin
      runners: ${{ inputs.runner == 'github' && '["ubuntu-latest"]' || '["self-hosted", "macos", "arm64"]' }}

  build-pos:
    needs: [unit]
    if: inputs.all == true || inputs.pos == true
    uses: ./.github/workflows/build-service-image.yml
    with:
      service: pos
      runners: ${{ inputs.runner == 'github' && '["ubuntu-latest"]' || '["self-hosted", "macos", "arm64"]' }}

  build-platform-api:
    needs: [guards, unit]
    if: inputs.all == true || inputs.platform-api == true
    uses: ./.github/workflows/build-service-image.yml
    with:
      service: platform-api
      timeout-minutes: 120
      runners: ${{ inputs.runner == 'github' && '["ubuntu-latest"]' || '["self-hosted", "macos", "arm64"]' }}

  build-platform-admin:
    needs: [unit]
    if: inputs.all == true || inputs.platform-admin == true
    uses: ./.github/workflows/build-service-image.yml
    with:
      service: platform-admin
      runners: ${{ inputs.runner == 'github' && '["ubuntu-latest"]' || '["self-hosted", "macos", "arm64"]' }}

  build-landing:
    needs: [unit]
    if: inputs.all == true || inputs.landing == true
    uses: ./.github/workflows/build-service-image.yml
    with:
      service: landing
      runners: ${{ inputs.runner == 'github' && '["ubuntu-latest"]' || '["self-hosted", "macos", "arm64"]' }}

  build-caddy:
    # The edge image has no tests of its own — the caddy-validate job is
    # its gate (a bad Caddyfile must never reach GHCR).
    needs: [caddy-validate]
    if: inputs.all == true || inputs.caddy == true
    uses: ./.github/workflows/build-service-image.yml
    with:
      service: caddy
      runners: ${{ inputs.runner == 'github' && '["ubuntu-latest"]' || '["self-hosted", "macos", "arm64"]' }}
