server {
    listen 80;
    server_name _;
    # The platform console is never a public index target.
    add_header X-Robots-Tag "noindex" always;
    root /usr/share/nginx/html;
    index index.html;

    # The console has no uploads (proofs are submitted by tenants through
    # the backend API); 10m covers any JSON payload with room to spare.
    client_max_body_size 10m;

    # SPA fallback: every non-file route serves the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The app shell MUST revalidate on every request, or a browser can
    # keep serving the previous deploy's cached index.html and the new
    # bundle never reaches already-logged-in operators.
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Hashed build assets: immutable — content never changes, so the
    # browser must not even revalidate.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        gzip_static on;
        try_files $uri =404;
    }

    # Fallback for direct container access / debugging only. In the
    # deployed stack Caddy owns the /api route on the saas. host and
    # proxies it to platform-api itself, so requests never reach this
    # location in production — but the proxy must exist for the
    # same-origin /api default to work when the console is reached
    # directly (e.g. a published debug port).
    location /api/ {
        proxy_pass http://platform-api:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Invoice PDF + audit CSV exports can take a while to generate.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
}
