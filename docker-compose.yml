# NOTE (Swarm): this stack deploys with `docker stack deploy` via Portainer
# on a Swarm endpoint, which validates against the Compose v3 schema:
# - `depends_on` MUST stay in LIST form (long form fails: "must be a list").
# - NO `platform:` (rejected: "Additional property platform is not allowed").
# - NO `pull_policy:` (not in the v3 schema either — Portainer re-pulls
#   images on redeploy instead; see the deploy-saas workflow).
# - Networks MUST use `driver: overlay` (bridge is node-local and breaks
#   multi-node scaling).
# - NO NESTED ${...:-...${...}...} expressions: Portainer's git-stack
#   substitution mangles them (proven live 2026-11-20: the backend got
#   the literal username "${POSTGRES_USER" and crash-looped). Build values
#   directly from simple ${VAR:-default} parts; wholesale URL overrides
#   are gone — override the parts (POSTGRES_*, CLIENT_DOMAIN) instead.
# Swarm ignores depends_on ordering entirely, so every service must
# tolerate briefly-unavailable dependencies (retries + restarts).
# (All proven live against the KVM4 Swarm endpoint, 2026-11-20.)
networks:
  ecomate-network:
    # Overlay (not bridge): Swarm stacks need overlay networking, and
    # bridge is node-local — it would break multi-node scaling.
    driver: overlay

volumes:
  postgres-data:
  uploads-data:
  backup-data:
  redis-data:
  mobile-builds-data:
  # Holds the generated encryption key for the license, attendance device
  # credentials and marketing OAuth tokens. Separate from uploads, backups and
  # mobile builds so nothing else in the container can read it. Losing this
  # volume makes that data permanently unreadable.
  license-data:
  # Per-tenant JSON exports (platform-api TENANT_EXPORT_DIR). Exports are
  # the only copy of a tenant's data after purge — this volume must persist
  # and be backed up like the databases.
  platform-exports-data:
  # Platform media library files (platform-api MEDIA_LOCAL_PATH). Landing
  # + branding assets only — tenant store media lives on uploads-data
  # and is served by media-static. This volume must persist and be
  # backed up: deleting it orphans the MediaAsset rows in the platform
  # DB (their bytes 404). Migration to R2 is per-row (see
  # docs/saas/media-storage.md) — the volume stays until every row has
  # moved.
  platform-media-data:
  # Caddy ACME certificates, OCSP staples and on-demand TLS state. MUST
  # persist: losing it forces re-issuance for every tenant host at once
  # (Let's Encrypt rate limits) and drops all cached certificates.
  caddy-data:
  caddy-config:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Pool headroom (Phase 8 decision D6): per-tenant backend pools can
    # reach 200 connections (2 per tenant x 100 cached clients) against
    # Postgres's 100 default — saturation begins at ~45 warm tenants.
    # 300 leaves room for the platform pool (10) + admin connections;
    # measure the real ceiling with k6 before canary.
    # Slow-query monitoring (Phase 8 Stage 2 item 21, compose part):
    # pg_stat_statements preload + 500ms slow-query logging + 30s
    # statement timeout. pg_stat_statements needs the extension created
    # in-DB to query the views; the preload here only enables the library.
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "log_min_duration_statement=500", "-c", "statement_timeout=30000"]
    networks:
      - ecomate-network
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # Tenant database name, standardised on `ecomate` (Phase 8 decision
      # D9 — docs/plan name; the old per-client default was ecomate_web).
      # The platform database (ecomate_platform) is created by the
      # platform-api startup script, not by this service.
      POSTGRES_DB: ${POSTGRES_DB:-ecomate}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          memory: 256M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Phase 9 P2: noeviction is load-bearing — BullMQ job data, the
    # extstore resolver cache and the per-store locks must NEVER be
    # evicted (an evicted job vanishes; an evicted lock breaks
    # serialization). With noeviction, writes fail when memory is full
    # instead of silently dropping queue state — that failure is loud
    # and monitorable, eviction is silent. NOTE: this covers fresh
    # deploys from this compose file; a LIVE Redis needs
    # `CONFIG SET maxmemory-policy noeviction` (+ persist to config)
    # applied at deploy — see docs/central-commerce/PORT-RECORD.md.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    networks:
      - ecomate-network
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 64M

  backend:
    image: ghcr.io/${DOCKER_REGISTRY_OWNER:-mahmudulhasanriaz}/ecomate-saas-backend:latest
    restart: unless-stopped
    networks:
      - ecomate-network
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    volumes:
      - uploads-data:/app/uploads
      - backup-data:/app/backup-storage
      - mobile-builds-data:/app/mobile-builds
      - license-data:/app/app-data
    # &backend-env: the `worker` service merges this whole env block
    # (WORKER_MODE overridden to `worker`). One source of truth — a flag
    # added here reaches both processes, so the worker can never run with
    # a kill switch the API considers off (or vice versa).
    environment: &backend-env
      NODE_ENV: production
      # Worker split (WORKER_MODE): this service is the HTTP API — it runs
      # schedulers but NO queue processors (see the `worker` service below).
      WORKER_MODE: api
      CLIENT_DOMAIN: ${CLIENT_DOMAIN}
      # SaaS domain config: tenant subdomains on every base domain, canonical
      # host preference and fallback. The storefront proxy uses the same values
      # to 301 alias hosts to the primary-domain canonical host.
      SAAS_PRIMARY_DOMAIN: ${SAAS_PRIMARY_DOMAIN:-}
      SAAS_BASE_DOMAINS: ${SAAS_BASE_DOMAINS:-}
      SAAS_FALLBACK_DOMAIN: ${SAAS_FALLBACK_DOMAIN:-}
      SAAS_PRIMARY_UNHEALTHY: ${SAAS_PRIMARY_UNHEALTHY:-false}
      SAAS_CUSTOM_DOMAIN_CNAME: ${SAAS_CUSTOM_DOMAIN_CNAME:-}
      SAAS_ALLOW_EXTERNAL_FALLBACK: ${SAAS_ALLOW_EXTERNAL_FALLBACK:-false}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ecomate}
      # Preferred tenant DSN (the tenancy layer reads this first, falling
      # back to DATABASE_URL). Set explicitly so the tenant database name
      # is one value everywhere (D9), not an accident of the fallback.
      # Runtime connects as `ecomate_app` (LOGIN, NOSUPERUSER, NOBYPASSRLS)
      # — NEVER the superuser: superusers bypass RLS entirely and the
      # boot-time RLS coverage gate refuses to start (proven live,
      # 2026-11-17). The password comes from TENANT_APP_DB_PASSWORD (no
      # default — the stack fails closed without it); startup.sh provisions
      # the role (LOGIN + password) on every boot, and migration 0002
      # grants it DML. Migrations keep running as the owner via
      # DATABASE_URL. The password must be URL-safe (letters, digits,
      # hyphen, underscore) — it is embedded in this DSN.
      TENANT_DATABASE_URL: postgresql://ecomate_app:${TENANT_APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-ecomate}
      TENANT_APP_DB_PASSWORD: ${TENANT_APP_DB_PASSWORD:-}
      REDIS_URL: redis://redis:6379
      # Platform control-plane link (registry sync, billing proxy,
      # impersonation bootstrap, plan-change refresh). Without BOTH vars
      # the backend runs with the control-plane link disabled by
      # configuration — no tenant registry feed at all.
      PLATFORM_API_URL: ${PLATFORM_API_URL:-http://platform-api:4100/api}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-}
      # Tenant registry poll interval (how often the backend re-reads the
      # tenant registry from the platform API).
      TENANT_REGISTRY_REFRESH_MS: ${TENANT_REGISTRY_REFRESH_MS:-60000}
      # Per-tenant Prisma client cache cap (Phase 8 decision D6, measured
      # with k6 in Stage 2): each cached client costs ~25-40 MB of heap, so
      # 60 clients (1.5-2.4 GB) cannot fit the heap budget below. 30 cached
      # clients x pool max 2 = 60 max tenant connections, inside the 300
      # Postgres max_connections above, and 30 is also the measured hard
      # ceiling (first pg-pool connection timeout). Code default is 100
      # (200 conns). Re-tune after the staging k6 run on real hardware.
      TENANT_PRISMA_MAX_CLIENTS: ${TENANT_PRISMA_MAX_CLIENTS:-30}
      # Default tenant for context-less paths (boot-time providers, health,
      # queued jobs until the tenant fan-out lands). REQUIRED: without it
      # the backend cannot boot — a provider touches Prisma during DI and
      # the request has no tenant context (proven live, 2026-11-17:
      # "Tenant context is required"). The default is the documented
      # fallback UUID, which targets an empty tenant scope (no tenant rows
      # exist under it); request paths always resolve a real tenant via
      # middleware, so this value is never used for tenant traffic. Set it
      # explicitly to a real tenant UUID only if a maintenance tenant is
      # ever created for that purpose.
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-00000000-0000-4000-8000-000000000000}
      DEFAULT_TENANT_SLUG: ${DEFAULT_TENANT_SLUG:-default}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:-}
      # Shared secret for storefront on-demand revalidation (P4). The backend
      # will present it to POST /api/revalidate after product/config mutations
      # (hookup pending); the storefront endpoint stays disabled until set.
      REVALIDATION_SECRET: ${REVALIDATION_SECRET:-}
      # Cloudflare edge-cache purge for the admin "Purge all cache" button
      # (P0 stale-bundle round, 2026-11-12). Token needs Zone:Cache Purge
      # on this tenant's zone(s) only; empty = the Cloudflare layer reports
      # "not configured" and the button purges everything else.
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: https://${CLIENT_DOMAIN:-mac.riaz.com.bd}
      PORT: 4000
      CORS_ORIGIN: http://localhost:3000,https://${CLIENT_DOMAIN:-mac.riaz.com.bd}
      APP_URL: https://${CLIENT_DOMAIN:-mac.riaz.com.bd}
      STOREFRONT_URL: https://${CLIENT_DOMAIN:-mac.riaz.com.bd}
      BACKUP_MAX_UPLOAD_BYTES: ${BACKUP_MAX_UPLOAD_BYTES:-107374182400}
      BACKUP_MAX_RESTORE_BYTES: ${BACKUP_MAX_RESTORE_BYTES:-107374182400}
      BACKUP_STORAGE_DIR: ${BACKUP_STORAGE_DIR:-/app/backup-storage}
      BACKUP_WORK_DIR: ${BACKUP_WORK_DIR:-/app/backup-storage/work}
      BACKUP_R2_ENDPOINT: ${BACKUP_R2_ENDPOINT:-}
      BACKUP_R2_ACCESS_KEY: ${BACKUP_R2_ACCESS_KEY:-}
      BACKUP_R2_SECRET_KEY: ${BACKUP_R2_SECRET_KEY:-}
      BACKUP_R2_BUCKET: ${BACKUP_R2_BUCKET:-}
      BACKUP_DUMP_TIMEOUT: ${BACKUP_DUMP_TIMEOUT:-1800000}
      BACKUP_ARCHIVE_TIMEOUT: ${BACKUP_ARCHIVE_TIMEOUT:-7200000}
      BACKUP_RESTORE_TIMEOUT: ${BACKUP_RESTORE_TIMEOUT:-86400000}
      BACKUP_WRITE_DRAIN_TIMEOUT: ${BACKUP_WRITE_DRAIN_TIMEOUT:-7200000}
      BACKUP_QUEUE_DRAIN_TIMEOUT: ${BACKUP_QUEUE_DRAIN_TIMEOUT:-7200000}
      BACKUP_DOWNLOAD_TTL_MS: ${BACKUP_DOWNLOAD_TTL_MS:-3600000}
      BACKUP_RESTORE_DATABASE_URL: ${BACKUP_RESTORE_DATABASE_URL:-}
      CSP_CONNECT_SRC: ${CSP_CONNECT_SRC:-}
      META_PIXEL_ID: ${META_PIXEL_ID:-}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
      TIKTOK_PIXEL_CODE: ${TIKTOK_PIXEL_CODE:-}
      TIKTOK_ACCESS_TOKEN: ${TIKTOK_ACCESS_TOKEN:-}
      GA_MEASUREMENT_ID: ${GA_MEASUREMENT_ID:-}
      GA_API_SECRET: ${GA_API_SECRET:-}
      GA_ADS_CONVERSION_ID: ${GA_ADS_CONVERSION_ID:-}
      GA_ADS_CONVERSION_LABEL: ${GA_ADS_CONVERSION_LABEL:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SEED_DUMMY_DATA: ${SEED_DUMMY_DATA:-false}
      RUN_SEED: ${RUN_SEED:-false}
      # Public API base URL (REQUIRED, https) — the webhook callback base
      # for provider webhook registration (G-04). Delivery URLs are
      # {PUBLIC_API_BASE_URL}/api/webhooks/stores/<provider>/<storeId>.
      # Registration fails loudly when unset; the VALUE is set per
      # environment at deploy (staging uses its own API host).
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-}
      # Phase 9 (central-commerce) kill switches (§3.8, rulings D5/D6):
      # ALL OFF by default at launch. The enablement flags default ON in
      # code (only an explicit 'false' disables), so the launch-off state
      # lives HERE as explicit 'false' values — do not delete these lines
      # or the flags silently turn on. Effective gate = kill switch AND
      # tenant entitlement. tracking_send_external_store_orders is
      # fail-closed in code (explicit 'true' required). The webhook body
      # cap defaults to 256KB (262144); NEW_SALES_CHANNEL_MODEL_ENABLED
      # ships OFF with P8 dual-write on.
      THIRD_PARTY_STORES_ENABLED: ${THIRD_PARTY_STORES_ENABLED:-false}
      store_sync_enabled: ${store_sync_enabled:-false}
      store_product_sync_enabled: ${store_product_sync_enabled:-false}
      store_product_import_enabled: ${store_product_import_enabled:-false}
      store_order_sync_enabled: ${store_order_sync_enabled:-false}
      store_stock_sync_enabled: ${store_stock_sync_enabled:-false}
      store_order_push_enabled: ${store_order_push_enabled:-false}
      store_reconcile_enabled: ${store_reconcile_enabled:-false}
      store_reconcile_widening_enabled: ${store_reconcile_widening_enabled:-false}
      store_stock_audit_enabled: ${store_stock_audit_enabled:-false}
      tracking_send_external_store_orders: ${tracking_send_external_store_orders:-false}
      store_webhook_max_body_bytes: ${store_webhook_max_body_bytes:-262144}
      NEW_SALES_CHANNEL_MODEL_ENABLED: ${NEW_SALES_CHANNEL_MODEL_ENABLED:-false}
      # Scale-test seeder opt-in (staging only — never set on a client
      # stack). Empty default = off. startup.sh + the script itself both
      # gate on ALLOW_SCALE_SEED=1, and the script also refuses known
      # client production domains unconditionally.
      ALLOW_SCALE_SEED: ${ALLOW_SCALE_SEED:-}
      # NOTE: STOCK_RECONCILE_ON_BOOT was REMOVED 2026-10-30 — boot-time
      # auto-heal no longer exists; reconciliation is explicit-only
      # (reconcile-stock.ts / admin Inventory → Reconciliation page).
      # Node heap ceiling, consumed by startup.sh. Must stay below the container
      # memory limit set in the deploy block below, or the kernel OOM-kills the
      # process before Node reaches its own ceiling.
      NODE_MAX_OLD_SPACE_SIZE: ${NODE_MAX_OLD_SPACE_SIZE:-2048}
      # Where the generated encryption key is persisted when
      # APP_ENCRYPTION_KEY is not supplied by the environment. The volume keeps
      # its historic `license-data` name so an already-provisioned key survives
      # the rename; the mount point is the new app-data path.
      APP_DATA_DIR: /app/app-data
      # Tracking-store retention sweep (90d PII anonymisation / 30d terminal
      # outbox purge / 2y archive). Only the literal 'false' disables it.
      RETENTION_ENABLED: ${RETENTION_ENABLED:-true}
      # Mobile Build (optional — only if client has mobile license)
      MOBILE_BUILDER_GITHUB_TOKEN: ${MOBILE_BUILDER_GITHUB_TOKEN:-}
      MOBILE_BUILDER_CALLBACK_TOKEN: ${MOBILE_BUILDER_CALLBACK_TOKEN:-}
      MOBILE_BUILDER_REPO: ${MOBILE_BUILDER_REPO:-EcoMate-Mobile-Builder}
      GITHUB_REPOSITORY_OWNER: ${GITHUB_REPOSITORY_OWNER:-mahmudulhasanriaz}
      MOBILE_BUILD_DIR: ${MOBILE_BUILD_DIR:-./mobile-builds}
      # Observability (Phase 8): structured JSON logging level.
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Sentry DSN (Phase 8). Empty = disabled (no account, no spend).
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Ops alert recipients, comma-separated (Phase 8). Empty = alerts skipped.
      OPS_ALERT_EMAIL: ${OPS_ALERT_EMAIL:-}
      OPS_ALERT_MIN_INTERVAL_MS: ${OPS_ALERT_MIN_INTERVAL_MS:-900000}
      # Direct SMTP for ops alerts (bypasses the email queue — an alert
      # about a broken queue must not depend on the queue).
      ALERT_SMTP_HOST: ${ALERT_SMTP_HOST:-}
      ALERT_SMTP_PORT: ${ALERT_SMTP_PORT:-587}
      ALERT_SMTP_SECURE: ${ALERT_SMTP_SECURE:-false}
      ALERT_SMTP_USER: ${ALERT_SMTP_USER:-}
      ALERT_SMTP_PASS: ${ALERT_SMTP_PASS:-}
      ALERT_SMTP_FROM: ${ALERT_SMTP_FROM:-}
      # BullMQ queue watcher (Phase 8): alerts on depth/failed jobs.
      QUEUE_WATCHER_ENABLED: ${QUEUE_WATCHER_ENABLED:-true}
      QUEUE_WATCHER_INTERVAL_MS: ${QUEUE_WATCHER_INTERVAL_MS:-60000}
      QUEUE_DEPTH_ALERT_THRESHOLD: ${QUEUE_DEPTH_ALERT_THRESHOLD:-1000}
      # Bull Board dashboard at /api/admin/queues (tenant superadmin only).
      BULL_BOARD_ENABLED: ${BULL_BOARD_ENABLED:-true}
      # Platform database URL (Phase 8): db_files backups dump it into
      # platform.sql. Same value as the platform-api service.
      PLATFORM_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/ecomate_platform
    depends_on:
      - postgres
      - redis
      # Ordering only (service_started, NOT service_healthy): the backend
      # must keep serving tenants if the platform API is briefly down
      # (registry sync keeps last-known-good). Hard-gating tenant boot on
      # the control plane would couple tenant availability to platform
      # availability.
      - platform-api
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Backend boot takes several minutes on this host (startup-script work
      # + Nest bootstrap before /api/health answers). A 15s grace marked the
      # container unhealthy mid-boot and failed every redeploy (Deploy #88).
      start_period: 600s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          # Raised from 512M: startup died with "JavaScript heap out of memory"
          # while Prisma loaded the 186-table schema. Raised again to 2560M in
          # Phase 8 (decision D6, measured with k6 in Stage 2): each cached
          # per-tenant Prisma client costs ~25-40 MB of heap, so the 30-client
          # cache needs ~0.75-1.2 GB on top of the ~0.7 GB base heap. Node's
          # heap has to fit inside this limit, otherwise the kernel OOM-kills
          # the process before Node's own ceiling is reached. startup.sh sets
          # --max-old-space-size to 2048, leaving ~512M for the container's
          # non-heap allocations (Prisma engine, buffers, native).
          memory: 2560M
        reservations:
          memory: 512M

  worker:
    # Queue worker (Phase 9 P1 "separate worker service(s)") — same backend
    # image as `backend`, no HTTP port. Runs the BullMQ processors only
    # (WORKER_MODE=worker); schedulers and HTTP stay on `backend`. Takes
    # effect at the next deploy (no live topology change until then).
    # Never runs startup.sh: migrations/seeds/role provisioning belong to
    # `backend` alone — two processes running `prisma migrate deploy`
    # concurrently would fight over the migration lock.
    image: ghcr.io/${DOCKER_REGISTRY_OWNER:-mahmudulhasanriaz}/ecomate-saas-backend:latest
    restart: unless-stopped
    # Self-provision the app-data dir (a fresh license-data volume is
    # root-owned; the encryption-key provisioner needs a 1001-writable dir),
    # then drop to the nestjs user exactly like startup.sh does. Heap via
    # --max-old-space-size on the node command line (no NODE_OPTIONS env:
    # the $ would need $$ escaping in compose and the value is tunable
    # through WORKER_MAX_OLD_SPACE_SIZE instead).
    command: ["sh", "-c", "mkdir -p /app/app-data && chown -R 1001:1001 /app/app-data && exec su -s /bin/sh nestjs -c \"node --max-old-space-size=${WORKER_MAX_OLD_SPACE_SIZE:-1536} dist/src/worker.main\""]
    networks:
      - ecomate-network
    volumes:
      - uploads-data:/app/uploads
      - backup-data:/app/backup-storage
      - license-data:/app/app-data
    environment:
      <<: *backend-env
      # The worker IS the queue consumer: processors only, no HTTP, no
      # schedulers. (Overrides the backend-env WORKER_MODE=api above.)
      WORKER_MODE: worker
    depends_on:
      - postgres
      - redis
      # Ordering only (service_started, NOT service_healthy): same
      # reasoning as backend — the worker keeps consuming with its
      # last-known-good registry if the platform API is briefly down.
      - platform-api
    healthcheck:
      # No HTTP here — the image HEALTHCHECK (wget /api/health) would fail
      # forever, so override it with a process-liveness probe (PID 1 is the
      # su/node chain; if node dies the container exits and restarts).
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Same slow boot as backend (Nest bootstrap + Prisma schema load).
      start_period: 600s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          # Same D6 basis as backend (30 cached tenant Prisma clients need
          # ~0.75-1.2 GB on top of the ~0.7 GB base heap), minus HTTP
          # overhead. Node heap 1536M (command line above) leaves ~512M
          # for non-heap allocations.
          memory: 2048M
        reservations:
          memory: 512M

  # backend-migrate is removed — migrations run automatically in backend service startup.sh

  storefront:
    image: ghcr.io/${DOCKER_REGISTRY_OWNER:-mahmudulhasanriaz}/ecomate-saas-storefront:latest
    restart: unless-stopped
    networks:
      - ecomate-network
    ports:
      - "${STOREFRONT_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      SAAS_PRIMARY_DOMAIN: ${SAAS_PRIMARY_DOMAIN:-}
      SAAS_BASE_DOMAINS: ${SAAS_BASE_DOMAINS:-}
      SAAS_FALLBACK_DOMAIN: ${SAAS_FALLBACK_DOMAIN:-}
      SAAS_PRIMARY_UNHEALTHY: ${SAAS_PRIMARY_UNHEALTHY:-false}
      API_URL: ${API_URL:-http://backend:4000/api}
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:-}
      # Guards POST /api/revalidate (on-demand cache invalidation, P4).
      # Leave empty to keep the endpoint disabled (401 for every call).
      REVALIDATION_SECRET: ${REVALIDATION_SECRET:-}
      NEXT_PUBLIC_API_URL: https://${CLIENT_DOMAIN:-mac.riaz.com.bd}/api
      NEXT_PUBLIC_STOREFRONT_URL: https://${CLIENT_DOMAIN:-mac.riaz.com.bd}
      # Same value as a plain runtime env (no NEXT_PUBLIC_ prefix, so
      # Next.js does NOT inline it at build time): the storefront reads
      # it at runtime as the env fallback for canonicals (lib/site-url.ts
      # envSiteUrl — the Settings domain wins over it when set).
      STORE_NEXT_PUBLIC_STOREFRONT_URL: https://${CLIENT_DOMAIN:-mac.riaz.com.bd}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
      NEXT_PUBLIC_GA_ADS_CONVERSION_ID: ${NEXT_PUBLIC_GA_ADS_CONVERSION_ID:-}
      POS_URL: ${POS_URL:-http://pos:80}
      # Round-3 perf: /uploads bytes are served by the media-static nginx
      # container (sendfile), not proxied through the backend Node process.
      # Rollback knob: set UPLOADS_URL=http://backend:4000 in the stack env
      # to restore the previous behaviour (backend serves the bytes).
      UPLOADS_URL: ${UPLOADS_URL:-http://media-static:80}
    depends_on:
      - backend
        # NOTE: no health gating — Swarm ignores depends_on entirely.
        # This only orders startup under plain compose; dependants must
        # tolerate a briefly-unavailable backend (retries + restarts).
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 256M

  admin:
    image: ghcr.io/${DOCKER_REGISTRY_OWNER:-mahmudulhasanriaz}/ecomate-saas-admin:latest
    restart: unless-stopped
    networks:
      - ecomate-network
    ports:
      - "${ADMIN_PORT:-8080}:80"
    environment:
      VITE_API_URL: ${ADMIN_VITE_API_URL:-/api}
      VITE_BASE: ${ADMIN_VITE_BASE:-/admin/}
      # POS Terminal sidebar link (e.g. https://pos.xyz.com/pos). Empty =
      # auto-detect (admin.* host -> pos.* host, localhost -> :5174).
      VITE_POS_URL: ${ADMIN_VITE_POS_URL:-}
    depends_on:
      - backend
        # NOTE: no health gating — Swarm ignores depends_on entirely.
        # This only orders startup under plain compose; dependants must
        # tolerate a briefly-unavailable backend (retries + restarts).
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80${ADMIN_VITE_BASE:-/admin/}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 64M

  pos:
    image: ghcr.io/${DOCKER_REGISTRY_OWNER:-mahmudulhasanriaz}/ecomate-saas-pos:latest
    restart: unless-stopped
    networks:
      - ecomate-network
    ports:
      - "${POS_PORT:-8081}:80"
    depends_on:
      - backend
        # NOTE: no health gating — Swarm ignores depends_on entirely.
        # This only orders startup under plain compose; dependants must
        # tolerate a briefly-unavailable backend (retries + restarts).
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/pos/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 64M

  # SaaS control plane: signup, provisioning, tenants, plans, billing,
  # domains, platform users, audit. Internal-only: no published port in
  # production — Caddy + landing + backend reach it on the internal
  # network. For staging debugging, a temporary
  # "${PLATFORM_PORT:-4100}:4100" mapping can be enabled.
  platform-api:
    image: ghcr.io/${DOCKER_REGISTRY_OWNER:-mahmudulhasanriaz}/ecomate-saas-platform-api:latest
    restart: unless-stopped
    networks:
      - ecomate-network
    volumes:
      - platform-exports-data:/app/data/tenant-exports
      - platform-media-data:/app/data/media
    environment:
      NODE_ENV: production
      PLATFORM_PORT: ${PLATFORM_PORT:-4100}
      PLATFORM_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/ecomate_platform
      PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET}
      PLATFORM_JWT_REFRESH_SECRET: ${PLATFORM_JWT_REFRESH_SECRET}
      # Real defaults (not empty): the auth service reads these with ??
      # and Number("") is 0 — an empty value would make every token
      # expire immediately.
      PLATFORM_JWT_EXPIRES_IN_SECONDS: ${PLATFORM_JWT_EXPIRES_IN_SECONDS:-900}
      PLATFORM_JWT_REFRESH_EXPIRES_IN_SECONDS: ${PLATFORM_JWT_REFRESH_EXPIRES_IN_SECONDS:-604800}
      # Short-lived token for the MFA second step / mid-login enrollment.
      PLATFORM_MFA_TOKEN_TTL_SECONDS: ${PLATFORM_MFA_TOKEN_TTL_SECONDS:-300}
      # Grace window in which replaying a just-rotated refresh token is a
      # plain 401 (console concurrent-refresh race) instead of a family
      # revoke.
      PLATFORM_REFRESH_REUSE_GRACE_MS: ${PLATFORM_REFRESH_REUSE_GRACE_MS:-30000}
      # Redis backing for the platform rate limiter (login/refresh/MFA/
      # verify/status/invite-accept + signup). Falls back to in-memory
      # counters when unreachable — the depends_on below is ordering, not
      # a boot requirement.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-}
      TLS_ASK_TOKEN: ${TLS_ASK_TOKEN:-}
      # AES-256-GCM key for stored SMTP passwords + TOTP MFA secrets at
      # rest. REQUIRED (64 hex chars) — encryption fails closed without
      # it. Same key material as the backend's APP_ENCRYPTION_KEY.
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      PLATFORM_MAIL_FROM: ${PLATFORM_MAIL_FROM:-EcoMate <no-reply@ecomate.bd>}
      # SMTP_FROM falls back to PLATFORM_MAIL_FROM in code (?? chain) —
      # an empty value here would BREAK that fallback, so the default
      # chains through PLATFORM_MAIL_FROM explicitly.
      SMTP_FROM: ${PLATFORM_MAIL_FROM:-EcoMate <no-reply@ecomate.bd>}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_VERIFY_URL: ${TURNSTILE_VERIFY_URL:-}
      # No nested defaults here (git deploys): each origin is set explicitly
      # per environment; the literal ecomate.bd default is production only.
      PLATFORM_LANDING_URL: ${PLATFORM_LANDING_URL:-https://www.ecomate.bd}
      PLATFORM_ADMIN_URL: ${PLATFORM_ADMIN_URL:-https://saas.ecomate.bd}
      TENANT_BACKEND_URL: ${TENANT_BACKEND_URL:-http://backend:4000/api}
      # Landing cache purge (Batch 1): the internal landing URL the
      # platform API calls to revalidate the landing cache. The shared
      # INTERNAL_SERVICE_SECRET above authenticates the call.
      LANDING_INTERNAL_URL: ${LANDING_INTERNAL_URL:-http://landing:3002}
      # Search-engine indexing kill-switch (Batch 1): 'false' hides the
      # landing from search engines (noindex + robots disallow-all +
      # empty sitemap) and wins over the console toggle. Set 'false' on
      # staging; leave unset (or 'true') on production.
      SEO_INDEXING_ENABLED: ${SEO_INDEXING_ENABLED:-true}
      DEFAULT_PLAN_VERSION_ID: ${DEFAULT_PLAN_VERSION_ID:-}
      PROVISIONING_STALE_MS: ${PROVISIONING_STALE_MS:-600000}
      TENANT_RETENTION_DAYS: ${TENANT_RETENTION_DAYS:-30}
      TENANT_PURGE_INTERVAL_MS: ${TENANT_PURGE_INTERVAL_MS:-21600000}
      TENANT_PURGE_ENABLED: ${TENANT_PURGE_ENABLED:-true}
      TENANT_EXPORT_DIR: /app/data/tenant-exports
      TENANT_EXPORT_MAX_ROWS: ${TENANT_EXPORT_MAX_ROWS:-250000}
      # Media library (platform assets — landing + branding). Files live
      # on the platform-media-data volume; the API serves the bytes at
      # GET /api/public/media/:id (public, immutable). MEDIA_STORAGE_DRIVER
      # is LEFT UNSET here so the console setting (Settings → Media
      # storage) controls the driver; set it to 'local' or 'r2' to lock
      # the driver from the environment (env wins, like the SEO flag).
      # MEDIA_PUBLIC_BASE_URL is the origin the API writes into content
      # URLs — the public API host, so other origins (the landing) can
      # load the files. Leave MEDIA_STORAGE_DRIVER empty to keep the
      # console switch effective.
      MEDIA_LOCAL_PATH: ${MEDIA_LOCAL_PATH:-/app/data/media}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-https://api.ecomate.bd}
      MEDIA_MAX_BYTES: ${MEDIA_MAX_BYTES:-104857600}
      MEDIA_STORAGE_DRIVER: ${MEDIA_STORAGE_DRIVER:-}
      IMPERSONATION_TTL_SECONDS: ${IMPERSONATION_TTL_SECONDS:-900}
      SIGNUP_DISPOSABLE_DOMAINS: ${SIGNUP_DISPOSABLE_DOMAINS:-}
      CUSTOM_DOMAIN_POLL_MS: ${CUSTOM_DOMAIN_POLL_MS:-60000}
      CUSTOM_DOMAIN_POLL_ENABLED: ${CUSTOM_DOMAIN_POLL_ENABLED:-true}
      # Billing lifecycle jobs (Phase 7). In-process runner, single
      # instance only — never scale platform-api past 1 replica with
      # jobs enabled, or jobs double-run.
      BILLING_JOBS_ENABLED: ${BILLING_JOBS_ENABLED:-true}
      BILLING_JOBS_INTERVAL_MS: ${BILLING_JOBS_INTERVAL_MS:-3600000}
      BILLING_CANCEL_AFTER_DAYS: ${BILLING_CANCEL_AFTER_DAYS:-30}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
      PLATFORM_ADMIN_NAME: ${PLATFORM_ADMIN_NAME:-Platform Admin}
      # First deploy only: seeds the superadmin + feature catalog + free
      # trial plan. The seed is idempotent (upserts), but leave it false
      # after the first deploy.
      RUN_PLATFORM_SEED: ${RUN_PLATFORM_SEED:-false}
      SAAS_PRIMARY_DOMAIN: ${SAAS_PRIMARY_DOMAIN:-}
      SAAS_BASE_DOMAINS: ${SAAS_BASE_DOMAINS:-}
      SAAS_FALLBACK_DOMAIN: ${SAAS_FALLBACK_DOMAIN:-}
      SAAS_PRIMARY_UNHEALTHY: ${SAAS_PRIMARY_UNHEALTHY:-false}
      SAAS_CUSTOM_DOMAIN_CNAME: ${SAAS_CUSTOM_DOMAIN_CNAME:-}
      SAAS_ALLOW_EXTERNAL_FALLBACK: ${SAAS_ALLOW_EXTERNAL_FALLBACK:-false}
      # App domain (parent of the console/API hosts). Empty = legacy
      # single-domain mode (hosts derive from SAAS_PRIMARY_DOMAIN). When
      # set it must be fully separate from the tenant domain.
      SAAS_APP_DOMAIN: ${SAAS_APP_DOMAIN:-}
      # Edge hosts, shared with Caddy: the platform API derives its own
      # platformHosts from the same values so links and routing agree.
      # Empty = derive from SAAS_APP_DOMAIN / SAAS_PRIMARY_DOMAIN.
      PLATFORM_LANDING_HOST: ${PLATFORM_LANDING_HOST:-}
      PLATFORM_ADMIN_HOST: ${PLATFORM_ADMIN_HOST:-}
      PLATFORM_API_HOST: ${PLATFORM_API_HOST:-}
      # Observability (Phase 8): structured JSON logging level.
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Sentry DSN (Phase 8). Empty = disabled (no account, no spend).
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Ops alert recipients, comma-separated (Phase 8). Empty = alerts skipped.
      OPS_ALERT_EMAIL: ${OPS_ALERT_EMAIL:-}
      OPS_ALERT_MIN_INTERVAL_MS: ${OPS_ALERT_MIN_INTERVAL_MS:-900000}
      # Billing-job failure watcher (Phase 8): polls job status, alerts on failure.
      JOB_WATCHER_ENABLED: ${JOB_WATCHER_ENABLED:-true}
      JOB_WATCHER_INTERVAL_MS: ${JOB_WATCHER_INTERVAL_MS:-300000}
      # TLS/domain health job (Phase 8): probes verified custom domains.
      TLS_PROBE_ENABLED: ${TLS_PROBE_ENABLED:-true}
      TLS_PROBE_INTERVAL_MS: ${TLS_PROBE_INTERVAL_MS:-3600000}
      TLS_EXPIRY_ALERT_DAYS: ${TLS_EXPIRY_ALERT_DAYS:-14}
      TLS_PROBE_PORT: ${TLS_PROBE_PORT:-443}
      TLS_PROBE_TIMEOUT_MS: ${TLS_PROBE_TIMEOUT_MS:-10000}
      TLS_PRIMARY_PROBE_ENABLED: ${TLS_PRIMARY_PROBE_ENABLED:-}
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4100/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 128M

  # SaaS platform console (Vite SPA). Served at the root of its own host
  # (saas.ecomate.bd) by Caddy; no published port, no runtime env (the
  # VITE_* vars are build-time, baked in by CI).
  platform-admin:
    image: ghcr.io/${DOCKER_REGISTRY_OWNER:-mahmudulhasanriaz}/ecomate-saas-platform-admin:latest
    restart: unless-stopped
    networks:
      - ecomate-network
    depends_on:
      - platform-api
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          memory: 32M

  # Public SaaS front door (Next.js): landing + signup + email verify.
  # Browser /api/* calls are rewritten server-side to the platform API.
  landing:
    image: ghcr.io/${DOCKER_REGISTRY_OWNER:-mahmudulhasanriaz}/ecomate-saas-landing:latest
    restart: unless-stopped
    networks:
      - ecomate-network
    environment:
      NODE_ENV: production
      PLATFORM_API_URL: ${PLATFORM_API_URL:-http://platform-api:4100/api}
      # Cache purge guard (Batch 1): the landing's POST /api/revalidate
      # accepts only requests carrying this shared secret (same value
      # as platform-api's INTERNAL_SERVICE_SECRET).
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-}
      # NEXT_PUBLIC_TURNSTILE_SITE_KEY is build-time (baked into the JS
      # bundle by CI) — NOT a runtime var, do not put it here.
    depends_on:
      - platform-api
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3002/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 128M

  # Public edge: TLS termination + host routing (portainer/Caddyfile,
  # baked into the image). The ONLY service on host 80/443 — if a
  # per-client stack already binds those ports on the VPS, this service
  # fails to start (confirm before staging deploy).
  caddy:
    image: ghcr.io/${DOCKER_REGISTRY_OWNER:-mahmudulhasanriaz}/ecomate-saas-caddy:latest
    restart: unless-stopped
    networks:
      - ecomate-network
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    environment:
      # Ask token for on-demand TLS. Falls back to the internal service
      # secret (same fallback the platform API uses) — the value must
      # never be empty, or every ask 401s and no tenant cert issues.
      TLS_ASK_TOKEN: ${TLS_ASK_TOKEN:-}
      # Let's Encrypt account email (expiry notices). Caddy rejects an empty
      # email at config load, so the default is baked in here and in the
      # Caddyfile placeholder itself.
      ACME_EMAIL: ${ACME_EMAIL:-support@ecomate.bd}
      # Platform hosts + primary domain (Caddyfile {$VAR:default}s).
      SAAS_PRIMARY_DOMAIN: ${SAAS_PRIMARY_DOMAIN:-ecomate.bd}
      # No nested defaults here (git deploys): each host is set explicitly
      # per environment; the literal ecomate.bd defaults are production only.
      PLATFORM_LANDING_HOST: ${PLATFORM_LANDING_HOST:-www.ecomate.bd}
      PLATFORM_ADMIN_HOST: ${PLATFORM_ADMIN_HOST:-saas.ecomate.bd}
      PLATFORM_API_HOST: ${PLATFORM_API_HOST:-api.ecomate.bd}
    depends_on:
      - backend
      - storefront
      - platform-api
    healthcheck:
      # Admin API on localhost only — port 2019 is NOT published.
      # Probe /config/, NOT /: the admin API root is a 404 in Caddy 2
      # (proven live 2026-11-17 — the / probe could never go healthy).
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 64M

  # Round-3 perf (2026-11-03): static media server. Serves the uploads
  # volume with nginx sendfile so image bytes never occupy the backend's
  # single CPU. The storefront's /uploads rewrite targets this service
  # (UPLOADS_URL); the backend keeps serving /uploads on its own origin
  # for direct API consumers, with identical headers.
  #
  # The nginx config is INLINE (env + entrypoint) on purpose: a single-file
  # bind mount of a repo file (./portainer/media-static.conf) broke the
  # Portainer git-stack deploy on 2026-11-03 — the host path did not exist
  # as a file in Portainer's compose dir, Docker auto-created it as a
  # directory, and the mount onto /etc/nginx/conf.d/default.conf failed,
  # taking the whole stack down. Never bind-mount repo files in this stack.
  #
  # Header parity with the backend's @fastify/static setup
  # (apps/backend/src/main.ts) is REQUIRED — do not drift:
  #   * every response: Content-Security-Policy: sandbox +
  #     X-Content-Type-Options: nosniff (security audit F15)
  #   * /uploads/derivatives/*: max-age=31536000, immutable
  #   * other originals: max-age=3600 (a restore can replace an original's
  #     bytes at the same URL — never pin those)
  # In the config below, $$ is compose escaping for a literal $.
  media-static:
    image: nginx:stable-alpine
    restart: unless-stopped
    networks:
      - ecomate-network
    volumes:
      - uploads-data:/srv/uploads:ro
    environment:
      MEDIA_STATIC_CONF: |
        server {
            listen 80;
            server_name _;
            root /srv;
            sendfile on;
            tcp_nopush on;
            access_log off;
            location /uploads/derivatives/ {
                try_files $$uri =404;
                add_header Content-Security-Policy "sandbox" always;
                add_header X-Content-Type-Options "nosniff" always;
                add_header Cache-Control "public, max-age=31536000, immutable" always;
            }
            location /uploads/ {
                try_files $$uri =404;
                add_header Content-Security-Policy "sandbox" always;
                add_header X-Content-Type-Options "nosniff" always;
                add_header Cache-Control "public, max-age=3600" always;
            }
            location / {
                return 404;
            }
        }
    entrypoint: ["sh", "-c", "printf '%s' \"$$MEDIA_STATIC_CONF\" > /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'"]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          memory: 32M
